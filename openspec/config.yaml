project:
  name: RoomForge Backend
  slug: sw1_pro_final_backend_2026_2
  description: >-
    API backend modular de RoomForge para identidad, autenticación y
    tenancy SaaS
  repository_root: .
  code_repository: .
  planned_change: hu005-trial-suscripcion
  planned_scope: >-
    Backend-only para HU-005 (PB-005 / CU-005 / CP-004); los artefactos del
    repositorio raíz son referencia externa y no se copian ni se mutan

sdd:
  artifact_store: hybrid
  execution: interactive
  delivery_strategy: ask-on-risk
  artifact_language: es
  code_language: en
  changed_lines_budget: 400
  strict_tdd: true
  phases:
    - explore
    - proposal
    - spec
    - design
    - tasks
    - apply
    - verify
    - archive

quality:
  strict_tdd: true
  test_runner: "..\\.venv\\Scripts\\python.exe -m pytest tests -q"
  lint_runner: "..\\.venv\\Scripts\\ruff.exe check app tests"
  typecheck_runner: "..\\.venv\\Scripts\\pyright.exe app tests"
  migration_runner: "..\\.venv\\Scripts\\python.exe -m alembic -c alembic.ini upgrade head"
  tdd_cycle: "RED → GREEN → TRIANGULATE → REFACTOR"
  conventions:
    commits: conventional-commits
    no_commits_or_pushes_during_sdd: true
    documentation: Spanish profesional y neutral
    code_identifiers: English

repository:
  architecture: API monolítica modular independiente
  stack:
    - Python >= 3.11
    - FastAPI
    - SQLAlchemy 2.x
    - PostgreSQL con psycopg
    - Alembic
    - Argon2id
    - PyJWT
    - pytest
    - Ruff
    - Pyright
  remote_project: sw1_pro_final_backend_2026_2
  worktree_root: D:/Universidad/Proyectos/2doSemestre2026/sw1/roomforge-hu005-backend
  branch_at_init: feature/hu005-trial-suscripcion
  base_branch: feature/tenant-hu04-06
  constraints:
    - No crear artefactos de cambio durante la inicialización
    - No modificar código, ejecutar tests, crear commits ni hacer push
    - No cambiar la rama local
    - Runtime, tests, migraciones y contabilidad nativa pertenecen a este backend
    - El monorepo raíz queda limitado a coordinación y documentación
    - No asumir visibilidad automática de los artefactos HU-005 del monorepo raíz
